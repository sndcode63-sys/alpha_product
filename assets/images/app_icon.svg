<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A86D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A4DA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A86D0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="256" cy="256" r="240" fill="url(#innerGradient)" />

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="200" fill="url(#bgGradient)" />

  <!-- AP Text -->
  <text x="256" y="256" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="8">AP</text>
</svg>